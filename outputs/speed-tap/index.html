<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d1a" />
    <meta name="description" content="Challenge your friends to five lightning-fast rounds. Create a room, share the code, and tap first." />
    <title>Speed Tap — beat the blink</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css?v=4" />
  </head>
  <body>
    <div class="background-glow background-glow-one" aria-hidden="true"></div>
    <div class="background-glow background-glow-two" aria-hidden="true"></div>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="Speed Tap home" data-action="home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-word">speed<span>tap</span></span>
        </a>
        <div class="header-center"><span class="live-dot"></span><span id="connection-label">Connecting</span></div>
        <div class="header-meta"><span class="header-meta-dot">✦</span> QUICK REFLEXES. GOOD FRIENDS.</div>
      </header>

      <main id="screen" class="screen" aria-live="polite"></main>

      <footer class="site-footer">
        <span>Five rounds. One very fast finger.</span>
        <span class="footer-right">MADE FOR THE MOMENT <span>↗</span></span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js?v=2" defer></script>
  </body>
</html>
